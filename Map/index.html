<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ban do Duong sat Viet Nam</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e17;
            color: #e0e6ed;
            overflow: hidden;
            height: 100vh;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        #sidebar {
            width: 380px;
            min-width: 380px;
            background: linear-gradient(180deg, #0f1524 0%, #131a2e 100%);
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        #sidebar.collapsed {
            transform: translateX(-380px);
            min-width: 0;
            width: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .stat-item {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .stat-item .num {
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
        }

        .stat-item .label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Search */
        .search-box {
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #e0e6ed;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: rgba(96,165,250,0.4);
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 0 3px rgba(96,165,250,0.1);
        }

        .search-box input::placeholder { color: #475569; }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 38px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 14px;
            pointer-events: none;
        }

        /* Line filters */
        .line-filters {
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .line-filters h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
            margin-bottom: 8px;
        }

        .line-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 10px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #94a3b8;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }

        .line-btn:hover { background: rgba(255,255,255,0.05); color: #e0e6ed; }
        .line-btn.active { background: rgba(255,255,255,0.08); color: #fff; }

        .line-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .line-count {
            margin-left: auto;
            font-size: 11px;
            color: #475569;
            background: rgba(255,255,255,0.05);
            padding: 2px 7px;
            border-radius: 10px;
        }

        /* Station list */
        .station-list-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Simulation panel */
        .simulator-box {
            margin: 12px 24px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
        }

        .sim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .sim-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #93c5fd;
            font-weight: 700;
        }

        .sim-status {
            font-size: 10px;
            color: #cbd5e1;
            background: rgba(148,163,184,0.15);
            border: 1px solid rgba(148,163,184,0.25);
            border-radius: 999px;
            padding: 2px 8px;
        }

        .sim-summary {
            font-size: 11px;
            line-height: 1.45;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .sim-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .sim-btn {
            flex: 1;
            border: 1px solid rgba(96,165,250,0.35);
            color: #dbeafe;
            background: linear-gradient(180deg, rgba(59,130,246,0.28), rgba(29,78,216,0.22));
            border-radius: 8px;
            padding: 7px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sim-btn:hover {
            border-color: rgba(96,165,250,0.6);
            background: linear-gradient(180deg, rgba(59,130,246,0.36), rgba(29,78,216,0.28));
        }

        .sim-steps {
            list-style: none;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .sim-step {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.4;
            padding: 5px 7px;
            border-radius: 6px;
            border: 1px solid transparent;
            margin-bottom: 4px;
        }

        .sim-step.active {
            color: #e2e8f0;
            background: rgba(59,130,246,0.16);
            border-color: rgba(96,165,250,0.3);
        }

        .sim-step.done {
            color: #86efac;
        }

        .station-list-header {
            padding: 12px 24px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .station-list-header h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
        }

        .station-list-count {
            font-size: 11px;
            color: #64748b;
        }

        #stationList {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        #stationList::-webkit-scrollbar { width: 4px; }
        #stationList::-webkit-scrollbar-track { background: transparent; }
        #stationList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .station-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .station-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.06);
        }

        .station-item.highlighted {
            background: rgba(96,165,250,0.1);
            border-color: rgba(96,165,250,0.2);
        }

        .station-marker-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid rgba(255,255,255,0.3);
        }

        .station-info {
            flex: 1;
            min-width: 0;
        }

        .station-name {
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-coords {
            font-size: 10.5px;
            color: #475569;
            font-family: 'SF Mono', 'Cascadia Code', monospace;
            margin-top: 1px;
        }

        .station-line-tag {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            font-weight: 500;
        }

        /* Map */
        #mapContainer {
            flex: 1;
            position: relative;
        }

        #map { width: 100%; height: 100%; }

        /* Toggle sidebar button */
        #toggleSidebar {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1001;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15,21,36,0.95);
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }

        #toggleSidebar:hover {
            background: rgba(30,40,65,0.95);
            color: #fff;
        }

        /* Custom Leaflet popup */
        .leaflet-popup-content-wrapper {
            background: rgba(15,21,36,0.95) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
            backdrop-filter: blur(12px) !important;
            color: #e0e6ed !important;
        }

        .leaflet-popup-tip {
            background: rgba(15,21,36,0.95) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
        }

        .leaflet-popup-close-button {
            color: #64748b !important;
        }

        .popup-content {
            padding: 4px;
            min-width: 200px;
        }

        .popup-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .popup-line {
            display: inline-block;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .popup-coords {
            font-family: 'SF Mono', 'Cascadia Code', monospace;
            font-size: 11.5px;
            color: #94a3b8;
            background: rgba(255,255,255,0.04);
            padding: 6px 8px;
            border-radius: 6px;
            line-height: 1.6;
        }

        .popup-coords span {
            color: #60a5fa;
            font-weight: 600;
        }

        .popup-model {
            margin-top: 8px;
            font-size: 11px;
            line-height: 1.45;
            color: #cbd5e1;
            border-top: 1px dashed rgba(148,163,184,0.25);
            padding-top: 8px;
        }

        /* Map legend */
        .map-legend {
            position: absolute;
            bottom: 24px;
            right: 16px;
            z-index: 1000;
            background: rgba(15,21,36,0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 16px;
            backdrop-filter: blur(12px);
            min-width: 200px;
        }

        .map-legend h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-size: 12px;
            color: #94a3b8;
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 2000;
                width: 320px;
                min-width: 320px;
            }
            #sidebar.collapsed {
                transform: translateX(-320px);
            }
        }

</head>

                <ul class="sim-steps" id="simSteps"></ul>

            <div class="station-list-container">

                    <h3>Danh sach nha ga</h3>
                    <span class="station-list-count" id="visibleCount"></span>
                </div>
                <div id="stationList"></div>

        </div>
        <div id="mapContainer">

            <div id="map"></div>
            <div class="map-legend" id="mapLegend">

    function createStationIcon(color, size = 6) {

                height: ${size}px;

    function popupContent(station, lineName, color) {
        const stationModel = STATION_MODELS[station.name];
        const modelHtml = stationModel
            ? `<div class="popup-model"><strong>Model:</strong> ${stationModel.popupNote}<br><strong>Nguon:</strong> ${stationModel.source}</div>`

        return `

                    <div><span>Lon:</span> ${station.lon.toFixed(6)}°E</div>
                </div>
                ${modelHtml}
            </div>
        `;
    }

    // Render all lines
    let totalStationCount = 0;
    const stationListData = [];

    let simulationTimer = null;

    function setSimulationStatus(text) {
        const el = document.getElementById('simStatus');
        if (el) el.textContent = text;
    }

    function renderSimulationSteps(steps, activeIndex = -1) {
        const listEl = document.getElementById('simSteps');
        if (!listEl) return;
        listEl.innerHTML = '';
        steps.forEach((step, idx) => {
            const li = document.createElement('li');
            li.className = 'sim-step';
            if (idx === activeIndex) li.classList.add('active');
            if (idx < activeIndex) li.classList.add('done');
            li.textContent = `T${idx + 1}: ${step}`;
            listEl.appendChild(li);
        });
    }

    function focusStationByName(name) {
        const station = stationListData.find(s => s.name === name);
        if (!station) return;
        map.setView([station.lat, station.lon], 14, { animate: true });
        station.marker.openPopup();
    }

    function runGaVinhSimulation() {
        const model = STATION_MODELS['Ga Vinh'];
        if (!model) return;

        if (simulationTimer) {
            clearInterval(simulationTimer);
            simulationTimer = null;
        }

        focusStationByName('Ga Vinh');
        renderSimulationSteps(model.steps, -1);
        setSimulationStatus('Running');

        let idx = -1;
        simulationTimer = setInterval(() => {
            idx += 1;
            if (idx >= model.steps.length) {
                clearInterval(simulationTimer);
                simulationTimer = null;
                setSimulationStatus('Done');
                renderSimulationSteps(model.steps, model.steps.length);
                return;
            }
            renderSimulationSteps(model.steps, idx);
        }, 1500);
    }

        const stations = RAILWAY_DATA[lineName];
        if (!stations) continue;

        const group = L.layerGroup();
        const coords = [];

        stations.forEach(station => {
            const isMajor = MAJOR_STATIONS.has(station.name);
            const icon = isMajor ? createMajorStationIcon(config.color) : createStationIcon(config.color);
            const marker = L.marker([station.lat, station.lon], { icon })
                .bindPopup(popupContent(station, config.label, config.color), { maxWidth: 280 });

            marker._stationData = station;
            marker._lineName = lineName;
            group.addLayer(marker);
            allMarkers.push(marker);
            coords.push([station.lat, station.lon]);

            stationListData.push({
                ...station,
                line: lineName,
                color: config.color,
                isMajor,
                marker
            });
        });

        // Draw polyline
        if (coords.length > 1) {
            const polyline = L.polyline(coords, {
                color: config.color,
                weight: config.weight,
                opacity: 0.7,
                smoothFactor: 1.5,
                lineCap: 'round',
                lineJoin: 'round'
            });
            group.addLayer(polyline);
            allPolylines.push(polyline);
        }

        group.addTo(map);
        lineGroups[lineName] = group;
        totalStationCount += stations.length;
    }

    // Add extra stations
    EXTRA_STATIONS.forEach(station => {
        const marker = L.marker([station.lat, station.lon], {
            icon: createStationIcon('#94a3b8', 5)
        }).bindPopup(popupContent(station, 'Tuyen khac', '#94a3b8'), { maxWidth: 280 });
        marker._stationData = station;
        marker._lineName = 'Khac';
        marker.addTo(map);
        allMarkers.push(marker);
        stationListData.push({
            ...station,
            line: 'Khac',
            color: '#94a3b8',
            isMajor: false,
            marker
        });
        totalStationCount += 1;
    });

    document.getElementById('totalStations').textContent = totalStationCount;

    // ============================================================
    // SIDEBAR UI
    // ============================================================

    // Toggle sidebar
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
        setTimeout(() => map.invalidateSize(), 350);
    });

    // Line filter buttons
    const lineFiltersEl = document.getElementById('lineFilters');
    for (const [lineName, config] of Object.entries(LINES_CONFIG)) {
        const count = RAILWAY_DATA[lineName]?.length || 0;
        const btn = document.createElement('button');
        btn.className = 'line-btn active';
        btn.innerHTML = `
            <span class="line-dot" style="background: ${config.color}"></span>
            <span>${config.label}</span>
            <span class="line-count">${count}</span>
        `;
        btn.addEventListener('click', () => {
            btn.classList.toggle('active');
            if (activeLines.has(lineName)) {
                activeLines.delete(lineName);
                map.removeLayer(lineGroups[lineName]);
            } else {
                activeLines.add(lineName);
                map.addLayer(lineGroups[lineName]);
            }
            renderStationList();
        });
        lineFiltersEl.appendChild(btn);
    }

    // Legend
    const legendEl = document.getElementById('mapLegend');
    for (const [lineName, config] of Object.entries(LINES_CONFIG)) {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `
            <span class="legend-line" style="background: ${config.color}"></span>
            <span>${config.label}</span>
        `;
        legendEl.appendChild(item);
    }

    // Station list
    function renderStationList(filter = '') {
        const list = document.getElementById('stationList');
        list.innerHTML = '';
        const filterLower = filter.toLowerCase();

        const filtered = stationListData.filter(s => {
            const matchLine = activeLines.has(s.line) || s.line === 'Khac';
            const matchSearch = !filter || s.name.toLowerCase().includes(filterLower);
            return matchLine && matchSearch;
        });

        document.getElementById('visibleCount').textContent = `${filtered.length} ga`;

        filtered.forEach(s => {
            const item = document.createElement('div');
            item.className = 'station-item';
            const lineConfig = LINES_CONFIG[s.line] || { color: '#94a3b8', label: 'Khac' };
            item.innerHTML = `
                <span class="station-marker-icon" style="background: ${s.color}; ${s.isMajor ? 'width:10px;height:10px;border-width:2px;' : ''}"></span>
                <div class="station-info">
                    <div class="station-name">${s.name}</div>
                    <div class="station-coords">${s.lat.toFixed(5)}°N, ${s.lon.toFixed(5)}°E</div>
                </div>
                <span class="station-line-tag" style="background: ${s.color}15; color: ${s.color}; border: 1px solid ${s.color}30;">
                    ${(lineConfig.label || 'Khac').split(' ').slice(-1)[0]}
                </span>
            `;
            item.addEventListener('click', () => {
                map.setView([s.lat, s.lon], 14, { animate: true });
                s.marker.openPopup();
                document.querySelectorAll('.station-item.highlighted').forEach(el => el.classList.remove('highlighted'));
                item.classList.add('highlighted');
            });
            list.appendChild(item);
        });
    }

    renderStationList();

    // Initialize simulation panel
    const vinhModel = STATION_MODELS['Ga Vinh'];
    if (vinhModel) {
        document.getElementById('simSummary').textContent = `${vinhModel.summary} Nguon: ${vinhModel.source}.`;
        renderSimulationSteps(vinhModel.steps, -1);
    }

    document.getElementById('simulateVinhBtn').addEventListener('click', runGaVinhSimulation);
    document.getElementById('focusVinhBtn').addEventListener('click', () => {
        focusStationByName('Ga Vinh');
        setSimulationStatus('Focused');
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderStationList(e.target.value);
    });

    // ============================================================
    // FIT BOUNDS
    // ============================================================
    const allCoords = stationListData.map(s => [s.lat, s.lon]);
    if (allCoords.length) {
        map.fitBounds(L.latLngBounds(allCoords).pad(0.05));
    }
    </script>
</body>
</html>
